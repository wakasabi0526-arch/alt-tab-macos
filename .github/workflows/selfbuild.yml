name: selfbuild

on:
  push:
    branches: [selfbuild]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
      - name: Generate local.xcconfig
        run: |
          cat > config/local.xcconfig <<EOF
          CURRENT_PROJECT_VERSION = 11.10.1
          APPCENTER_SECRET =
          EOF
      - name: Build (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project alt-tab-macos.xcodeproj -scheme Release -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            OTHER_CODE_SIGN_FLAGS= \
            > build.log 2>&1 || { grep -E "error:" build.log | head -30; exit 1; }
          grep -E "BUILD SUCCEEDED" build.log
      - name: Verify app
        run: |
          APP="DerivedData/Build/Products/Release/AltTab.app"
          test -d "$APP"
          codesign -dv "$APP" 2>&1 | head -6
          file "$APP/Contents/MacOS/AltTab"
      - name: Zip with ditto (preserve symlinks)
        run: |
          cd DerivedData/Build/Products/Release
          ditto -c -k --keepParent AltTab.app AltTab-selfbuild.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AltTab
          path: DerivedData/Build/Products/Release/AltTab-selfbuild.zip
          if-no-files-found: error
